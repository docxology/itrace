name: Verify iTrace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked --with pytest --with pytest-timeout --with tomli pytest tests/ -q
      - run: uv build --wheel --out-dir dist
      - run: |
          uv venv wheel-env
          uv pip install --python wheel-env/bin/python dist/*.whl
          wheel-env/bin/python -I -c "import importlib.util, itrace; from pathlib import Path; assert 'site-packages' in itrace.__file__; assert (Path(itrace.__file__).parent / 'py.typed').is_file(); assert (Path(itrace.__file__).parent / 'web_static' / 'app.js').is_file(); assert all(importlib.util.find_spec(m) is None for m in ('cv2','mediapipe','streamlit','matplotlib','fastapi')); from itrace.synthetic import gaze_with_saccade; from itrace.pipeline import analyze_gaze; assert len(analyze_gaze(gaze_with_saccade()[0]).saccades) == 1"
          wheel-env/bin/itrace demo
          wheel-env/bin/itrace study --help
          wheel-env/bin/itrace study-report --help
          wheel-env/bin/python -I -c "from pathlib import Path; import itrace; from itrace.study.provenance import provenance; p = provenance(); assert p['installation_kind'] == 'installed-package'; assert len(p['source_files']) > 20; assets = Path(itrace.__file__).parent / 'web_static'; assert all((assets / name).is_file() for name in ('study.html', 'study.css', 'study.js', 'study-api.js', 'study-targets.js'))"
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version-file: ".python-version"
      # The locked dev toolchain (numpy 1.26 / scipy 1.17, held there by the
      # mediapipe capture pin) has no CPython 3.15 wheels, so this job runs on 3.12.
      - run: uv sync --locked --python 3.12 --extra dev
      - run: uv run --locked --python 3.12 python scripts/verify.py --out-dir output/verification/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-receipts
          path: output/verification/ci
  optional-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["figures", "web", "dashboard", "capture", "all"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version-file: ".python-version"
      - run: uv build --out-dir dist
      - name: Install source distribution with advertised extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          # The capture pin (mediapipe 0.10.21) only ships wheels up to CPython 3.12.
          case "$EXTRA" in
            capture|all) uv venv --python 3.12 package-env ;;
            *) uv venv package-env ;;
          esac
          for artifact in dist/*.tar.gz; do
            uv pip install --python package-env/bin/python "${artifact}[${EXTRA}]"
          done
      - name: Exercise installed package and optional imports
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          package-env/bin/python -I - <<'PY'
          import importlib
          import os
          from pathlib import Path
          import itrace
          modules = {
              "figures": ("matplotlib",),
              "web": ("fastapi", "uvicorn"),
              "dashboard": ("streamlit", "plotly"),
              "capture": ("cv2", "mediapipe"),
          }
          selected = modules.values() if os.environ["EXTRA"] == "all" else [modules[os.environ["EXTRA"]]]
          assert "site-packages" in itrace.__file__
          for group in selected:
              for name in group:
                  importlib.import_module(name)
          if os.environ["EXTRA"] in ("web", "all"):
              from itrace.live.server import create_app
              assert create_app().version == itrace.__version__
          if os.environ["EXTRA"] in ("figures", "all"):
              from itrace.viz.graphical_abstract import generate_graphical_abstract
              output = Path("package-figures")
              output.mkdir()
              assert generate_graphical_abstract(output, repo_root=Path.cwd()).is_file()
          PY
          package-env/bin/itrace demo
